spring.config.import=file:env.properties
# DB_NAME in env.properties: volume/ (prod) usa il default, volume-dev/ usa ieg-dev
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:ieg-2.1}
spring.datasource.username=postgres
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${PORT_SERVER}
spring.profiles.active=dev
spring.output.ansi.enabled=always
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=true
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# log config
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.emmek=DEBUG
logging.file.name=log/ieg.log
# Cloudinary config
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.apikey=${CLOUDINARY_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}
#
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
admin.email=${ADMIN_EMAIL}
#
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB
#
spring.security.user.password=${SECURITY_PASSWORD}
# thread per il calcolo delle fatture nella generazione massiva (la composizione excel/pdf usa una sola istanza di Excel)
fatture.generazione.thread=4

# dimensione massima di ogni zip dei pdf da inviare per email (allegato in base64 ~ +37%: 14 MB per stare sotto 20 MB a messaggio)
fatture.zip.max-mb=14

# comando di pg_dump per il backup del db (GET /api/db/dump): "pg_dump", il percorso completo tra virgolette,
# o "docker exec -e PGPASSWORD postgres pg_dump" se pg_dump esiste solo nel container di Postgres
db.dump.comando=${DB_DUMP_COMANDO:pg_dump}
